name: Validate and publish

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: docker build -t keycloak-post-exporter:test -f docker/Dockerfile .

  build:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código-fonte
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Login no Quay.io
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        run: echo "${QUAY_PASSWORD}" | docker login quay.io -u "${QUAY_USERNAME}" --password-stdin

      - name: Build da imagem Docker
        run: |
          docker build \
            -t quay.io/thiagobotelho/keycloak-post-exporter:latest \
            -t "quay.io/thiagobotelho/keycloak-post-exporter:${GITHUB_SHA}" \
            -f docker/Dockerfile .

      - name: Push da imagem para Quay.io
        run: docker push --all-tags quay.io/thiagobotelho/keycloak-post-exporter
