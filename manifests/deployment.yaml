apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-post-exporter
  labels:
    app: keycloak-post-exporter
spec:
  # Número de instâncias; réplicas isoladamente não garantem alta disponibilidade.
  # Número de instâncias; réplicas isoladamente não garantem alta disponibilidade.
  replicas: 1
  # Seletores precisam corresponder aos labels dos recursos de destino.
  # Seletores precisam corresponder aos labels dos recursos de destino.
  selector:
    matchLabels:
      app: keycloak-post-exporter
  template:
    metadata:
      labels:
        app: keycloak-post-exporter
    spec:
      containers:
        - name: exporter
          image: quay.io/thiagobotelho/keycloak-post-exporter@sha256:3aaabf258e08f9893e45d3376a487f97a4deac68ad913ee0a158bfa6e9ff6492
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: metrics
          # Prontidão controla recebimento de tráfego, sem provar integrações externas.
          # Prontidão controla recebimento de tráfego, sem provar integrações externas.
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          # Falha desta sonda pode reiniciar o container; evite depender de serviços externos.
          # Falha desta sonda pode reiniciar o container; evite depender de serviços externos.
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 30
          envFrom:
            - secretRef:
                name: keycloak-auth-secret
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          # Restringe privilégios do processo; conferir compatibilidade com a SCC.
          # Restringe privilégios do processo; conferir compatibilidade com a SCC.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
