apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: keycloak-post-exporter
  labels:
    release: prometheus
spec:
  # Seletores precisam corresponder aos labels dos recursos de destino.
  # Seletores precisam corresponder aos labels dos recursos de destino.
  selector:
    matchLabels:
      app: keycloak-post-exporter
  endpoints:
    - port: metrics
      interval: 1m
